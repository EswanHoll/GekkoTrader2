name: ci-frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/deploy_frontend.sh"
      - ".github/workflows/deploy-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/deploy_frontend.sh"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck, test, build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          test -f dist/index.html
          test -f dist/config.js
          test -f dist/_redirects
          test -f dist/_headers
          if grep -qE 'GEKKO_API_URL[[:space:]]*=[[:space:]]*["'\'']https://' dist/config.js; then
            echo "ERROR: dist/config.js must not ship a hard-coded Control URL in CI." >&2
            exit 1
          fi
          if grep -qE '^name[[:space:]]*=[[:space:]]*"gekkotrader"' wrangler.toml; then
            echo "ERROR: wrangler.toml must not name Pages project gekkotrader." >&2
            exit 1
          fi

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build + patch Control URL
        working-directory: frontend
        env:
          CONTROL_API_URL__PROJ_GEKKOTRADER2: ${{ secrets.CONTROL_API_URL__PROJ_GEKKOTRADER2 }}
          CONTROL_API_URL: ${{ secrets.CONTROL_API_URL }}
        run: |
          npm ci
          npm run build
          API_URL="${CONTROL_API_URL__PROJ_GEKKOTRADER2:-${CONTROL_API_URL:-}}"
          UI_VERSION="$(date -u +%Y%m%d%H%M)"
          python3 - dist/config.js "$API_URL" "$UI_VERSION" <<'PY'
          import pathlib, re, sys
          path, api_url, ui_version = sys.argv[1:4]
          text = pathlib.Path(path).read_text()
          if api_url:
              text = re.sub(
                  r"(root\.GEKKO_API_URL\s*=\s*)[^;]+;",
                  rf"root.GEKKO_API_URL = {api_url!r};",
                  text,
                  count=1,
              )
          text = re.sub(
              r"(root\.GEKKO_UI_VERSION\s*=\s*)[^;]+;",
              rf"root.GEKKO_UI_VERSION = {ui_version!r};",
              text,
              count=1,
          )
          pathlib.Path(path).write_text(text)
          print(f"patched api={bool(api_url)} ui={ui_version}")
          PY
          if grep -qE '^name[[:space:]]*=[[:space:]]*"gekkotrader"' wrangler.toml; then
            echo "ERROR: wrangler.toml must not name Pages project gekkotrader." >&2
            exit 1
          fi

      - name: Deploy to Pages project gekkotrader2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name gekkotrader2 --branch main
