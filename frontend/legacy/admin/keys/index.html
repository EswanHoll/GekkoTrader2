  <link rel="apple-touch-icon" href="/gekko-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=202608041620" />
</head>
<body class="page-admin-keys" data-shell-page="workspace" data-operator-wire="page">
  <div class="atmosphere" aria-hidden="true"></div>

  <div class="app-shell" data-shell="workspace">
    <header class="app-topbar">
      <a class="app-brand" href="/" aria-label="GekkoTrader home">
        <img src="/gekko-logo.png" alt="" width="28" height="28" />
        <span class="app-brand-copy"><strong>GekkoTrader</strong></span>
      </a>
      <button class="app-menu-trigger" type="button"
              aria-label="Open navigation" aria-controls="appSidebar"
              aria-expanded="false"></button>
      <div id="appTopNav" class="app-topnav-region"></div>

    </header>

    <aside id="appSidebar" class="app-sidebar" aria-label="Primary navigation">
      <div class="app-sidebar-inner">
        <div class="app-sidebar-head">
          <button type="button" class="app-rail-toggle" id="shellRailToggle"
            aria-controls="appSidebarNav" aria-expanded="true"
            title="Collapse navigation" aria-label="Collapse navigation">
            <span class="shell-label shell-rail-toggle-label">Collapse</span>
          </button>
        </div>
        <nav class="app-sidebar-primary" id="appSidebarNav" aria-label="Desk navigation"></nav>
        <nav class="app-sidebar-utility" id="appSidebarUtility" aria-label="Admin" hidden></nav>
        <div class="app-sidebar-footer" id="appAccountFooter" data-auth-primary-host="1">
          <a class="shell-account-trigger shell-footer-signin" id="shellSignIn" href="/login/?force=1" data-auth-primary="1" title="Sign in" aria-label="Sign in"><span class="shell-account-avatar" aria-hidden="true">?</span><span class="shell-account-meta"><strong class="shell-label">Sign in</strong></span></a>
        </div>
      </div>
    </aside>
    <div id="appSidebarBackdrop" class="app-sidebar-backdrop" hidden></div>

    <div class="app-content-shell">
      <div id="appBreadcrumbs" class="app-breadcrumb-region"></div>
      <div id="appContent" class="app-content-scroll">

<div class="page-intro page-intro-row">
      <div class="page-intro-copy">
        <p class="eyebrow">Super admin</p>
        <h1 class="page-title">Keys</h1>
        <p class="tagline"><strong>Operator secret</strong> (once) and exchange keys for Live / Demo.</p>
      </div>
      <p class="page-intro-actions">
        <a class="btn ghost" href="/admin/operator/">Environments</a>
      </p>
    </div>

    <main>
      <section class="panel panel-compact" id="operatorPanel" aria-label="Operator secret" data-operator-wire="page">
        <h2 class="heading-with-tip">Operator secret
          <button type="button" class="info-tip" aria-label="About operator secret">
            <span class="info-tip-icon" aria-hidden="true">i</span>
            <span class="info-tip-bubble" role="tooltip">Writes unlock from your signed-in admin login. You do not need to paste OPERATOR_CONTROL_SECRET for Start Run / Save. That shared secret stays on Control servers (workers/CLI). The optional field below is legacy only — leave it blank.</span>
          </button>
        </h2>
        <div class="operator-row" data-operator-form>
          <label class="auth-label" for="operatorSecret">Operator secret (optional / legacy)</label>
          <input
            id="operatorSecret"
            name="gekko-operator-control-secret"
            data-operator-secret
            type="password"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            data-lpignore="true"
            data-1p-ignore="true"
            data-bwignore="true"
            readonly
            placeholder="Optional — leave blank; admin login unlocks writes"
          />
        </div>
        <div class="operator-actions">
          <button type="button" class="btn" data-operator-mint>Unlock writes</button>
          <button type="button" class="btn ghost" data-operator-logout>Lock writes</button>
          <button type="button" class="btn ghost" data-operator-forget hidden>Forget secret</button>
          <button type="button" class="btn ghost" id="keysRefreshBtn">Refresh keys</button>
        </div>
        <p class="operator-status" data-operator-status id="operatorGateStatus"></p>
      </section>

      <section class="panel" aria-label="Key status">
        <h2 class="heading-with-tip">Exchange keys
          <button type="button" class="info-tip" aria-label="About exchange keys">
            <span class="info-tip-icon" aria-hidden="true">i</span>
            <span class="info-tip-bubble" role="tooltip">Exchange keys for Demo/Live live in the AWS password vault — not on this browser and not wiped by website releases. With the operator secret saved, status loads automatically. Values are never shown again. Sim never receives exchange keys.</span>
          </button>
        </h2>
        <p class="section-copy muted-line" id="keysStatusMeta"></p>
        <div id="keysTargetsRoot" class="compare-grid-summaries admin-keys-grid"></div>
      </section>
    </main>
      </div>
    </div>
  </div>

    </nav>

</body>
</html>
